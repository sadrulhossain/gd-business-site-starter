name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        # Same tag as MONGO_VERSION in .env.example; the "Mongo pin" step fails when they differ.
        image: mongo:8.0.38
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: gdsite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # corepack first, so setup-node can read the pnpm store path (pnpm 12.18.0 comes from packageManager).
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mongo pin
        run: test "$(sed -n 's/^MONGO_VERSION=//p' .env.example)" = "8.0.38"
      - name: Typecheck and lint
        # No package defines a lint script yet; --if-present keeps this step honest once one does.
        run: |
          pnpm -r --if-present typecheck
          pnpm -r --if-present lint
      - name: Tests (API with Mongo, admin, portal, route audit)
        run: pnpm -r --if-present test
      - name: Workflow scripts
        run: node --test scripts/
      - name: OpenAPI parity with the legacy contract
        run: node scripts/openapi-parity.mjs
      - name: Version floors
        run: node scripts/check-floors.mjs | tail -n 1
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Secrets scan
        run: sh scripts/check-secrets.sh
      - name: actionlint
        # Pinned dev tool run from its image (docs/VERSIONS.md, "Tools run on demand"); not a dependency.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
