# Dev stack: MongoDB, Mailpit, and one node container (wrangler dev API + admin + portal). Each service lists its own environment.
services:
  mongo:
    image: mongo:${MONGO_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-mailpit
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Debian-based (glibc) image: workerd does not run on Alpine by default.
  node:
    image: node:${NODE_VERSION}-${NODE_DEBIAN_SUFFIX}
    container_name: ${COMPOSE_PROJECT_NAME}-node
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "/app/docker/node/dev.sh"]
    ports:
      - "127.0.0.1:${API_DEV_PORT}:${API_DEV_PORT}"
      - "127.0.0.1:${ADMIN_DEV_PORT}:${ADMIN_DEV_PORT}"
      - "127.0.0.1:${PORTAL_DEV_PORT}:${PORTAL_DEV_PORT}"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - PNPM_STORE_DIR=/app/node_modules/.pnpm-store
      - API_DEV_PORT=${API_DEV_PORT}
      - ADMIN_DEV_PORT=${ADMIN_DEV_PORT}
      - PORTAL_DEV_PORT=${PORTAL_DEV_PORT}
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=${MONGODB_DB}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - CORS_ALLOWED_ORIGINS=http://localhost:${ADMIN_DEV_PORT},http://localhost:${PORTAL_DEV_PORT}
      - LOCALE_DEFAULT=${LOCALE_DEFAULT}
      - LOCALE_FALLBACK=${LOCALE_FALLBACK}
      - LOCALE_SUPPORTED=${LOCALE_SUPPORTED}
      - SITE_URL=${SITE_URL}
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
      - api-node-modules:/app/api/node_modules
      - admin-node-modules:/app/web/admin/node_modules
      - portal-node-modules:/app/web/portal/node_modules
      - api-types-node-modules:/app/packages/api-types/node_modules
      - api-client-node-modules:/app/packages/api-client/node_modules
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.API_DEV_PORT+'/api/v1/meta/locales').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

volumes:
  mongo-data:
  root-node-modules:
  api-node-modules:
  admin-node-modules:
  portal-node-modules:
  api-types-node-modules:
  api-client-node-modules:
